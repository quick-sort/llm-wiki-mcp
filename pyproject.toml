[project]
name = "llm-wiki-mcp"
version = "0.1.0"
description = "HTTP MCP server for wiki knowledge base — query & ingest tools powered by llm-wiki-agent skills via Claude Agent SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.9.0",
    "claude-agent-sdk>=0.1.0",
    "httpx>=0.28.0",
    "markitdown>=0.1.6",
    "openai>=1.0.0",
    "trafilatura>=2.0.0",
]

[tool.uv]
package = true

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"

[project.scripts]
llm-wiki-mcp = "llm_wiki_mcp.server:main"
