name: Test

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"

env:
  UV_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest tests/ -v
